substitutions:
  _REGION: asia-southeast1
  _REPO: scrapper-ats
  _API_SERVICE: scrapper-ats-api
  _WORKER_SERVICE: scrapper-ats-worker

steps:
  - id: build-api
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/api/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA"
      - .

  - id: push-api
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA"]

  - id: build-worker
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/worker/Dockerfile
      - -t
      - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA"
      - .

  - id: push-worker
    name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA"]

  # apps/api/Dockerfile's CMD is `tsx watch` (shared with local docker-compose,
  # which relies on the watcher for hot-reload). Override the entrypoint here
  # instead of editing the Dockerfile, so production drops the file-watcher
  # without touching local dev.
  - id: deploy-api
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_API_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --command=pnpm
      - --args=exec,tsx,src/index.ts
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=3
      - --set-env-vars=NODE_ENV=production
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,DEEPSEEK_AI=DEEPSEEK_AI:latest,API_KEYS=API_KEYS:latest,ADMIN_API_KEYS=ADMIN_API_KEYS:latest,ADMIN_PASSWORD=ADMIN_PASSWORD:latest,CORS_ORIGINS=CORS_ORIGINS:latest

  # Chromium wants ~1GB RAM and gen2 for full syscall support (Playwright's
  # sandbox needs more than Cloud Run's default gen1 execution environment
  # allows). concurrency=1 keeps one Chromium instance per container instance
  # so parallel Inngest invocations never share/starve that memory.
  # --allow-unauthenticated is required here too: Inngest Cloud invokes this
  # URL directly over HTTPS and verifies the request itself via
  # INNGEST_SIGNING_KEY, not via Cloud Run IAM.
  - id: deploy-worker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - "${_WORKER_SERVICE}"
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --execution-environment=gen2
      - --command=pnpm
      - --args=exec,tsx,src/index.ts
      - --memory=1Gi
      - --cpu=1
      - --concurrency=1
      - --timeout=3600
      - --min-instances=0
      - --max-instances=2
      - --set-env-vars=NODE_ENV=production
      - --set-secrets=DATABASE_URL=DATABASE_URL:latest,DEEPSEEK_AI=DEEPSEEK_AI:latest,INNGEST_EVENT_KEY=INNGEST_EVENT_KEY:latest,INNGEST_SIGNING_KEY=INNGEST_SIGNING_KEY:latest

images:
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/api:$SHORT_SHA"
  - "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/worker:$SHORT_SHA"

options:
  logging: CLOUD_LOGGING_ONLY
