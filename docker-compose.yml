services:
  postgres:
    image: postgres:16-alpine
    env_file: .env.docker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inngest:
    image: inngest/inngest:latest
    command: "inngest dev -u http://worker:3002/api/inngest --no-discovery"
    ports:
      - "8288:8288"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env.docker
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file: .env.docker
    environment:
      PORT: "3002"
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    env_file: .env.docker
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
